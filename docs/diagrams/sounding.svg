<text class="sd-t sd-sm" x="48" y="435">from an item millpond sends.</text>
</g>
<g class="sd-cap1"><circle class="sd-badge" cx="253" cy="414" r="10"/>
<text class="sd-badget" x="253" y="418" text-anchor="middle">2</text>
<text class="sd-t sd-sm" x="270" y="418">One session works it in a</text>
<text class="sd-t sd-sm" x="270" y="435">worktree of its own.</text>
</g>
<g class="sd-cap2"><circle class="sd-badge" cx="475" cy="414" r="10"/>
<text class="sd-badget" x="475" y="418" text-anchor="middle">3</text>
<text class="sd-t sd-sm" x="492" y="418">It ends on a conclusion: the</text>
<text class="sd-t sd-sm" x="492" y="435">answer, evidence, the work.</text>
</g>
<g class="sd-cap3"><circle class="sd-badge" cx="697" cy="414" r="10"/>
<text class="sd-badget" x="697" y="418" text-anchor="middle">4</text>
<text class="sd-t sd-sm" x="714" y="418">You decide it: accept,</text>
<text class="sd-t sd-sm" x="714" y="435">go on, or drop.</text>
</g>
</svg>
