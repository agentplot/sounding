<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" class="sd-root dg" role="img" aria-labelledby="sd-ttl sd-dsc"><title id="sd-ttl">sounding: one question, one session, one conclusion</title><desc id="sd-dsc">A session types /sound take mise 2027.1? and goes on with its own work, its progress bar never stopping; beside it, millpond can send an item that asks a question. sounding opens a worktree on the branch sounding/take-mise-2027 and writes question.md. One session works the question there against a 45 minute timebox: it reads the question and the release notes, runs CI on the new version, writes prototype code to try/bump.patch, finds two scripts failing on a renamed flag, and concludes. conclusion.md holds the answer, take mise 2027.1 once two CI scripts pass --locked, its evidence, the work it proposes and what stays open. The card waits on the operator, who accepts it. Prototype code stays on the branch: a sluice submission from sounding/* is refused.</desc><style>:root{--dg-bg:#e9e7e0;--dg-panel:#f2f1ec;--dg-soft:#dbd9d1;--dg-rule:#c9c7bf;--dg-fg:#0e1116;--dg-muted:#5d6370;--dg-accent:#a3358f;--dg-accent-soft:color-mix(in oklab,#a3358f 20%,#f2f1ec);--dg-pond:#2160b0;--dg-ink:#f7f6f2;--dg-ok:#1f8a4c;--dg-warn:#8a5a00;--dg-bad:#c0392b}@media (prefers-color-scheme:dark){:root{--dg-bg:#161a21;--dg-panel:#1b2029;--dg-soft:#21232b;--dg-rule:#2a2f38;--dg-fg:#f2f1ec;--dg-muted:#8c92a0;--dg-accent:#e486d2;--dg-accent-soft:color-mix(in oklab,#e486d2 20%,#1b2029);--dg-pond:#6ea8fe;--dg-ink:#0e1116;--dg-ok:#45c27a;--dg-warn:#e9b44c;--dg-bad:#f08a7e}}
